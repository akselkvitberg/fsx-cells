# Builds and tests the host and the plugin, and runs the Plugin Verifier, on every push and pull request.
# Pushing a tag like v0.2.0 also creates a GitHub release with the plugin zip attached and, when the PUBLISH_TOKEN
# secret is set, publishes the plugin to the JetBrains Marketplace (v0.3.0-eap.1 goes to the "eap" channel).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Plugin version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep '^version' plugin/gradle.properties | cut -d= -f2 | tr -d ' ')-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test host
        run: dotnet test host/FsxCells.Host.Tests

      - name: Test and build plugin
        working-directory: plugin
        run: ./gradlew test buildPlugin -Pversion=${{ steps.version.outputs.version }} --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: fsx-cells-${{ steps.version.outputs.version }}
          path: plugin/build/distributions/*.zip

      # The verifier downloads the Rider versions it checks against, which needs several GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/swift /usr/local/lib/android /opt/ghc /usr/local/.ghcup

      - name: Verify plugin
        working-directory: plugin
        run: ./gradlew verifyPlugin -Pversion=${{ steps.version.outputs.version }} --console=plain

      - name: Verifier report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: plugin/build/reports/pluginVerifier
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check for a Marketplace token
        if: ${{ env.PUBLISH_TOKEN == '' }}
        run: echo "::notice::PUBLISH_TOKEN is not set; not publishing to the JetBrains Marketplace."

      - uses: actions/checkout@v4
        if: ${{ env.PUBLISH_TOKEN != '' }}

      - uses: actions/setup-dotnet@v4
        if: ${{ env.PUBLISH_TOKEN != '' }}
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v4
        if: ${{ env.PUBLISH_TOKEN != '' }}
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ env.PUBLISH_TOKEN != '' }}

      - name: Publish to the JetBrains Marketplace
        if: ${{ env.PUBLISH_TOKEN != '' }}
        working-directory: plugin
        run: ./gradlew publishPlugin -Pversion=${GITHUB_REF_NAME#v} --console=plain

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "fsx-cells $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Install from the JetBrains Marketplace (Settings > Plugins, search for FSX Cells), or with Settings > Plugins > ⚙ > Install Plugin from Disk and the attached zip."
