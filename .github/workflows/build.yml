# Builds and tests the host and the plugin on every push and pull request.
# Pushing a tag like v0.2.0 also creates a GitHub release with the plugin zip attached
# (GitHub only; nothing is published to the JetBrains Marketplace).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Plugin version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep '^version' plugin/gradle.properties | cut -d= -f2 | tr -d ' ')-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test host
        run: dotnet test host/FsxCells.Host.Tests

      - name: Test and build plugin
        working-directory: plugin
        run: ./gradlew test buildPlugin -Pversion=${{ steps.version.outputs.version }} --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: fsx-cells-${{ steps.version.outputs.version }}
          path: plugin/build/distributions/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "fsx-cells $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Install in Rider: Settings > Plugins > ⚙ > Install Plugin from Disk, and pick the attached zip."
