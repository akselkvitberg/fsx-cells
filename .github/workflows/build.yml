# Builds and tests the host and the plugin on Linux, Windows and macOS, and runs the Plugin Verifier, on every push and
# pull request.
# Pushing a tag like v0.2.0 also creates a GitHub release with the plugin zip attached and, when the PUBLISH_TOKEN
# secret is set, publishes the plugin to the JetBrains Marketplace (v0.3.0-eap.1 goes to the "eap" channel).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Finding dotnet, starting processes and paths differ per OS, so build and test on all three. The zip, the
    # Plugin Verifier and the release use the Linux build.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Before anything else: the Gradle cache (Rider, and the Rider versions the verifier checks against) and the
      # Rider that Gradle unpacks need more disk than the Linux runner has free. A full disk kills the runner, without
      # a log.
      - name: Free disk space
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          df -h /
          sudo rm -rf /usr/share/swift /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/dotnet/sdk/*preview* \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Plugin version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep '^version' plugin/gradle.properties | cut -d= -f2 | tr -d ' \r')-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test host
        run: dotnet test host/FsxCells.Host.Tests

      - name: Host smoke test (the installed SDK's F# compiler)
        run: host/smoke-test.sh

      - name: Test and build plugin
        working-directory: plugin
        run: ./gradlew test buildPlugin -Pversion=${{ steps.version.outputs.version }} --console=plain

      - name: Test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin-test-report-${{ matrix.os }}
          path: plugin/build/reports/tests
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          name: fsx-cells-${{ steps.version.outputs.version }}
          path: plugin/build/distributions/*.zip

      - name: Verify plugin
        if: ${{ matrix.os == 'ubuntu-latest' }}
        working-directory: plugin
        run: ./gradlew verifyPlugin -Pversion=${{ steps.version.outputs.version }} --console=plain

      - name: Verifier report
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: plugin/build/reports/pluginVerifier
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check for a Marketplace token
        if: ${{ env.PUBLISH_TOKEN == '' }}
        run: echo "::notice::PUBLISH_TOKEN is not set; not publishing to the JetBrains Marketplace."

      - uses: actions/checkout@v4
        if: ${{ env.PUBLISH_TOKEN != '' }}

      - uses: actions/setup-dotnet@v4
        if: ${{ env.PUBLISH_TOKEN != '' }}
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v4
        if: ${{ env.PUBLISH_TOKEN != '' }}
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ env.PUBLISH_TOKEN != '' }}

      - name: Publish to the JetBrains Marketplace
        if: ${{ env.PUBLISH_TOKEN != '' }}
        working-directory: plugin
        run: ./gradlew publishPlugin -Pversion=${GITHUB_REF_NAME#v} --console=plain

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "fsx-cells $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Install from the JetBrains Marketplace (Settings > Plugins, search for FSX Cells), or with Settings > Plugins > ⚙ > Install Plugin from Disk and the attached zip."
